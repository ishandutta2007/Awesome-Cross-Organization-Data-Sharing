<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatNode1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatNode2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes shimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #a855f7; }
      100% { stop-color: #38bdf8; }
    }

    .bg-grid { opacity: 0.7; }
    .data-flow {
      stroke-dasharray: 6, 8;
      animation: dashMove 2.5s linear infinite;
    }
    .orb-1 {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-2 {
      transform-origin: 1000px 300px;
      animation: pulseOrb 10s ease-in-out infinite 1s;
    }
    .node-float-1 { animation: floatNode1 4s ease-in-out infinite; }
    .node-float-2 { animation: floatNode2 5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
  <circle class="orb-2" cx="1000" cy="300" r="180" fill="#7c3aed" filter="url(#glow)" opacity="0.25" />
  <circle cx="600" cy="380" r="120" fill="#0d9488" filter="url(#glow)" opacity="0.15" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" class="bg-grid" rx="16" />

  <!-- Dynamic Data Stream Lines / Inter-organization flows (Background) -->
  <g opacity="0.45">
    <path class="data-flow" d="M 80 80 Q 250 140, 400 90 T 800 120 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-flow" d="M 80 340 Q 300 280, 550 330 T 950 300 T 1120 350" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Peripheral Architecture Nodes (Subtle Background Visuals) -->
  <g class="node-float-1" opacity="0.6">
    <circle cx="110" cy="180" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ORG A</text>
  </g>

  <g class="node-float-2" opacity="0.6">
    <circle cx="1090" cy="190" r="28" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="1090" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ORG B</text>
  </g>

  <!-- Dynamic Connection Rays to Center -->
  <line x1="140" y1="180" x2="250" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <line x1="1060" y1="190" x2="950" y2="190" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Category Pill Badge -->
  <g>
    <rect x="445" y="42" width="310" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="463" cy="59" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="595" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.5" text-anchor="middle">
      ENTERPRISE ARCHITECTURE &amp; APIS
    </text>
  </g>

  <!-- Title (Foreground, Sharp, High Contrast) -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="url(#primaryGrad)">Cross-Organization</tspan>
    <tspan fill="#ffffff"> Data Sharing</tspan>
  </text>

  <!-- Subtitle (Clear and Readable) -->
  <text x="600" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
    Zero-Copy Sharing • Open Protocols • Privacy Data Clean Rooms • Sovereign Data Spaces
  </text>

  <!-- Central Horizontal Divider -->
  <line x1="380" y1="220" x2="820" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="8,8" />

  <!-- Feature Highlights / Capability Badges in Foreground -->
  <g transform="translate(180, 245)">
    <!-- Pill 1: Zero-Copy Sharing -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="185" height="42" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="92" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Zero-Copy Sharing</text>
    </g>

    <!-- Pill 2: Open Protocols (OpenSharing) -->
    <g transform="translate(210, 0)">
      <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="200" height="42" rx="10" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="100" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">🌐 OpenSharing Protocols</text>
    </g>

    <!-- Pill 3: Data Clean Rooms -->
    <g transform="translate(435, 0)">
      <rect width="195" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="195" height="42" rx="10" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="97" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">🛡️ Data Clean Rooms</text>
    </g>

    <!-- Pill 4: Sovereign Data Spaces -->
    <g transform="translate(655, 0)">
      <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="185" height="42" rx="10" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="92" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#5eead4" text-anchor="middle">🏛️ Sovereign Spaces</text>
    </g>
  </g>

  <!-- Tagline Banner Bottom -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
    A curated collection of production platforms, specifications, and open-source ecosystems
  </text>
</svg>
